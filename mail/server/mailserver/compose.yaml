name: mailserver

services:
    mailserver:
        container_name: mailserver
        image: mailserver/docker-mailserver:${MAILSERVER_VERSION:-17}
        restart: unless-stopped
        # user: "${UID:-1000}:${GID:-1000}"
        environment:
            TZ: "${TZ:-Europe/Warsaw}"
            ENABLE_RSPAMD: "${ENABLE_RSPAMD:-1}"
            ENABLE_CLAMAV: "${ENABLE_CLAMAV:-1}"
            ENABLE_FAIL2BAN: "${ENABLE_FAIL2BAN:-1}"
        cap_add:
            - NET_ADMIN # For Fail2Ban to work
        # ports:
        #     - ${MAILSERVER_BIND_IP:-127.0.0.1}:${MAILSERVER_PORT_25:-1025}:25
        #     - ${MAILSERVER_BIND_IP:-127.0.0.1}:${MAILSERVER_PORT_465:-1465}:465
        #     - ${MAILSERVER_BIND_IP:-127.0.0.1}:${MAILSERVER_PORT_587:-1587}:587
        #     - ${MAILSERVER_BIND_IP:-127.0.0.1}:${MAILSERVER_PORT_993:-1993}:993
        hostname: "${DOMAIN:-mailserver.localhost}"
        networks:
            shared-network:
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - shared-home:/home/${APP_USER:-app}
            - mailserver-mail-data:/var/mail/
            - mailserver-mail-state:/var/mail-state/
            - mailserver-mail-logs:/var/log/mail/
            - mailserver-config:/tmp/docker-mailserver/
        labels:
            traefik.enable: "true"
            traefik.tcp.services.mailserver25.loadbalancer.server.port: "25"
            traefik.tcp.routers.mailserver25.rule: "HostSNI(`${DOMAIN:-mailserver.localhost}`)"
            traefik.tcp.routers.mailserver25.entrypoints: "mailserver25"
            traefik.tcp.routers.mailserver25.tls: "true"
            traefik.tcp.routers.mailserver25.service: "mailserver25"
            traefik.tcp.services.mailserver465.loadbalancer.server.port: "465"
            traefik.tcp.routers.mailserver465.rule: "HostSNI(`${DOMAIN:-mailserver.localhost}`)"
            traefik.tcp.routers.mailserver465.entrypoints: "mailserver465"
            traefik.tcp.routers.mailserver465.tls: "true"
            traefik.tcp.routers.mailserver465.service: "mailserver465"
            traefik.tcp.services.mailserver587.loadbalancer.server.port: "587"
            traefik.tcp.routers.mailserver587.rule: "HostSNI(`${DOMAIN:-mailserver.localhost}`)"
            traefik.tcp.routers.mailserver587.entrypoints: "mailserver587"
            traefik.tcp.routers.mailserver587.tls: "true"
            traefik.tcp.routers.mailserver587.service: "mailserver587"
            traefik.tcp.services.mailserver993.loadbalancer.server.port: "993"
            traefik.tcp.routers.mailserver993.rule: "HostSNI(`${DOMAIN:-mailserver.localhost}`)"
            traefik.tcp.routers.mailserver993.entrypoints: "mailserver993"
            traefik.tcp.routers.mailserver993.tls: "true"
            traefik.tcp.routers.mailserver993.service: "mailserver993"
        tty: true

networks:
    shared-network:
        name: ${SHARED_NETWORK_NAME:-shared-network}
        external: true

volumes:
    shared-home:
        name: ${SHARED_HOME_VOLUME:-shared-home}
        external: true
    mailserver-mail-data:
        name: mailserver-mail-data
    mailserver-mail-state:
        name: mailserver-mail-state
    mailserver-mail-logs:
        name: mailserver-mail-logs
    mailserver-config:
        name: mailserver-config
