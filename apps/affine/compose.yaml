name: affine

services:
    affine:
        container_name: affine
        # no major tag published - bump manually
        image: ghcr.io/toeverything/affine:${AFFINE_VERSION:-0.27.4}
        restart: unless-stopped
        depends_on:
            affine-migration:
                condition: service_completed_successfully
        # user: "${UID:-1000}:${GID:-1000}"
        environment:
            TZ: "${TZ:-Europe/Warsaw}"
            REDIS_SERVER_HOST: "${REDIS_SERVER_HOST:-valkey9}"
            REDIS_SERVER_PORT: "${REDIS_SERVER_PORT:-6379}"
            REDIS_SERVER_USERNAME: "${REDIS_SERVER_USERNAME:-}"
            REDIS_SERVER_PASSWORD: "${REDIS_SERVER_PASSWORD:-secret}"
            REDIS_SERVER_DATABASE: "${REDIS_SERVER_DATABASE:-0}"
            DATABASE_URL: "${DATABASE_URL:-postgresql://affine:affine@pgvector-pg18:5432/affine}"
            AFFINE_INDEXER_ENABLED: "${AFFINE_INDEXER_ENABLED:-false}"
            AFFINE_SERVER_HTTPS: "${AFFINE_SERVER_HTTPS:-true}"
            AFFINE_SERVER_HOST: "${AFFINE_SERVER_HOST:-affine.localhost}"
        # ports:
        #     - ${AFFINE_BIND_IP:-127.0.0.1}:${AFFINE_PORT:-3010}:3010
        hostname: "${DOMAIN:-affine.localhost}"
        networks:
            shared-network:
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - shared-home:/home/${APP_USER:-app}
            - affine-storage:/root/.affine/storage
            - affine-conf:/root/.affine/config
        labels:
            # caddy: "${DOMAIN:-affine.localhost}"
            # caddy.reverse_proxy: "{{upstreams 3010}}"
            traefik.enable: "true"
            traefik.http.services.affine.loadbalancer.server.port: "3010"
            traefik.http.routers.affine.rule: "Host(`${DOMAIN:-affine.localhost}`)"
            traefik.http.routers.affine.entrypoints: "http"
            traefik.http.routers.affine.tls: "false"
            traefik.http.routers.affine.service: "affine"
            traefik.http.routers.affine.middlewares: "redirect-to-https@docker"
            traefik.http.routers.affine-secure.rule: "Host(`${DOMAIN:-affine.localhost}`)"
            traefik.http.routers.affine-secure.entrypoints: "https"
            traefik.http.routers.affine-secure.tls: "true"
            traefik.http.routers.affine-secure.service: "affine"
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://127.0.0.1:3010/info').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        tty: true

    affine-migration:
        container_name: affine-migration
        # no major tag published - bump manually
        image: ghcr.io/toeverything/affine:${AFFINE_VERSION:-0.27.4}
        command: ["sh", "-c", "node ./scripts/self-host-predeploy.js"]
        # user: "${UID:-1000}:${GID:-1000}"
        environment:
            TZ: "${TZ:-Europe/Warsaw}"
            REDIS_SERVER_HOST: "${REDIS_SERVER_HOST:-valkey9}"
            REDIS_SERVER_PORT: "${REDIS_SERVER_PORT:-6379}"
            REDIS_SERVER_USERNAME: "${REDIS_SERVER_USERNAME:-}"
            REDIS_SERVER_PASSWORD: "${REDIS_SERVER_PASSWORD:-secret}"
            REDIS_SERVER_DATABASE: "${REDIS_SERVER_DATABASE:-0}"
            DATABASE_URL: "${DATABASE_URL:-postgresql://affine:affine@pgvector-pg18:5432/affine}"
            AFFINE_INDEXER_ENABLED: "${AFFINE_INDEXER_ENABLED:-false}"
            AFFINE_SERVER_HTTPS: "${AFFINE_SERVER_HTTPS:-true}"
            AFFINE_SERVER_HOST: "${AFFINE_SERVER_HOST:-affine.localhost}"
        networks:
            shared-network:
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - shared-home:/home/${APP_USER:-app}
            - affine-storage:/root/.affine/storage
            - affine-conf:/root/.affine/config
        tty: true

networks:
    shared-network:
        name: ${SHARED_NETWORK_NAME:-shared-network}
        external: true

volumes:
    shared-home:
        name: ${SHARED_HOME_VOLUME:-shared-home}
        external: true
    affine-storage:
        name: affine-storage
    affine-conf:
        name: affine-conf
