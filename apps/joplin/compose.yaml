name: joplin

services:
    joplin:
        container_name: joplin
        # no major tag published - bump manually
        image: joplin/server:${JOPLIN_VERSION:-3.7.5}
        restart: unless-stopped
        # user: "${UID:-1000}:${GID:-1000}"
        environment:
            TZ: "${TZ:-Europe/Warsaw}"
            APP_BASE_URL: "${APP_BASE_URL:-https://${DOMAIN:-joplin.localhost}}"
            APP_PORT: "${APP_PORT:-22300}"
            DB_CLIENT: "${DB_CLIENT:-pg}"
            POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-joplin}"
            POSTGRES_DATABASE: "${POSTGRES_DATABASE:-joplin}"
            POSTGRES_USER: "${POSTGRES_USER:-joplin}"
            POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
            POSTGRES_HOST: "${POSTGRES_HOST:-postgres18}"
        # ports:
        #     - ${JOPLIN_BIND_IP:-127.0.0.1}:${JOPLIN_PORT:-22300}:22300
        hostname: "${DOMAIN:-joplin.localhost}"
        networks:
            shared-network:
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - shared-home:/home/${APP_USER:-app}
        labels:
            # caddy: "${DOMAIN:-joplin.localhost}"
            # caddy.reverse_proxy: "{{upstreams ${APP_PORT:-22300}}}"
            traefik.enable: "true"
            traefik.http.services.joplin.loadbalancer.server.port: "${APP_PORT:-22300}"
            traefik.http.routers.joplin.rule: "Host(`${DOMAIN:-joplin.localhost}`)"
            traefik.http.routers.joplin.entrypoints: "http"
            traefik.http.routers.joplin.tls: "false"
            traefik.http.routers.joplin.service: "joplin"
            traefik.http.routers.joplin.middlewares: "redirect-to-https@docker"
            traefik.http.routers.joplin-secure.rule: "Host(`${DOMAIN:-joplin.localhost}`)"
            traefik.http.routers.joplin-secure.entrypoints: "https"
            traefik.http.routers.joplin-secure.tls: "true"
            traefik.http.routers.joplin-secure.service: "joplin"
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://127.0.0.1:${APP_PORT:-22300}/api/ping').then((r) => process.exit(r.status < 500 ? 0 : 1), () => process.exit(1))",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        tty: true

networks:
    shared-network:
        name: ${SHARED_NETWORK_NAME:-shared-network}
        external: true

volumes:
    shared-home:
        name: ${SHARED_HOME_VOLUME:-shared-home}
        external: true
