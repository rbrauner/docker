name: cadvisor

services:
    cadvisor:
        container_name: cadvisor
        image: gcr.io/cadvisor/cadvisor
        restart: unless-stopped
        privileged: true
        environment:
            TZ: "${TZ:-Europe/Warsaw}"
        # ports:
        #     - ${CADVISOR_PORT:-8080}:8080
        hostname: cadvisor
        networks:
            shared-network:
        devices:
            - /dev/kmsg
        volumes:
            - /:/rootfs:ro
            - /var/run:/var/run:ro
            - /sys:/sys:ro
            - /var/lib/docker/:/var/lib/docker:ro
            - /dev/disk/:/dev/disk:ro
        tty: true

networks:
    shared-network:
        name: ${SHARED_NETWORK_NAME:-shared-network}
        external: true
