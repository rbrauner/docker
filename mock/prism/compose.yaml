name: prism

services:
    prism:
        container_name: prism
        image: stoplight/prism:4
        restart: unless-stopped
        command: [ "mock", "-d", "-h", "0.0.0.0", "/spec/openapi.yaml" ]
        # user: "${UID:-1000}:${GID:-1000}"
        environment:
            TZ: "${TZ:-Europe/Warsaw}"
        # ports:
        #     - ${PRISM_PORT:-4010}:4010
        hostname: "${DOMAIN:-prism.localhost}"
        networks:
            shared-network-internal:
        volumes:
            - shared-home:/home/${APP_USER:-app}
            - ./spec:/spec:ro
        labels:
            # caddy: "${DOMAIN:-prism.localhost}"
            # caddy.reverse_proxy: "{{upstreams 4010}}"
            traefik.enable: "true"
            traefik.http.services.prism.loadbalancer.server.port: "4010"
            traefik.http.routers.prism.rule: "Host(`${DOMAIN:-prism.localhost}`)"
            traefik.http.routers.prism.entrypoints: "http"
            traefik.http.routers.prism.tls: "false"
            traefik.http.routers.prism.service: "prism"
            traefik.http.routers.prism.middlewares: "redirect-to-https@docker"
            traefik.http.routers.prism-secure.rule: "Host(`${DOMAIN:-prism.localhost}`)"
            traefik.http.routers.prism-secure.entrypoints: "https"
            traefik.http.routers.prism-secure.tls: "true"
            traefik.http.routers.prism-secure.service: "prism"
        tty: true

networks:
    shared-network-internal:
        name: ${SHARED_NETWORK_INTERNAL_NAME:-shared-network-internal}
        external: true

volumes:
    shared-home:
        name: ${SHARED_HOME_VOLUME:-shared-home}
        external: true
