name: scripts-php-pwd

services:
    php:
        container_name: scripts-php-pwd-php
        build:
            context: .
            dockerfile: ./Dockerfile
            target: app
            args:
                TZ: "${TZ:-Europe/Warsaw}"
                USER: "${APP_USER:-app}"
                GROUP: "${APP_GROUP:-app}"
                UID: "${UID:-1000}"
                GID: "${GID:-1000}"
        restart: unless-stopped
        # user: "${UID:-1000}:${GID:-1000}"
        environment:
            TZ: "${TZ:-Europe/Warsaw}"
            HOME: "/home/${APP_USER:-app}"
            PHP_IDE_CONFIG: "serverName=scripts-php-pwd.localhost"
        # ports:
        #     - ${SCRIPTS_PHP_PWD_BIND_IP:-127.0.0.1}:${SCRIPTS_PHP_PWD_PORT:-80}:80
        hostname: "${DOMAIN:-scripts-php-pwd.localhost}"
        networks:
            shared-network:
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - caddy-data:/data
            - caddy-config:/config
            - shared-home:/home/${APP_USER:-app}
            - .:/var/www/html
            - ./configs/php.ini:/usr/local/etc/php/php.ini:ro
            - ./configs/Caddyfile:/etc/frankenphp/Caddyfile:ro
        labels:
            # caddy: "${DOMAIN:-scripts-php-pwd.localhost}"
            # caddy.reverse_proxy: "{{upstreams 80}}"
            traefik.enable: "true"
            traefik.http.services.scripts-php-pwd.loadbalancer.server.port: "80"
            traefik.http.routers.scripts-php-pwd.rule: "Host(`${DOMAIN:-scripts-php-pwd.localhost}`)"
            traefik.http.routers.scripts-php-pwd.entrypoints: "http"
            traefik.http.routers.scripts-php-pwd.tls: "false"
            traefik.http.routers.scripts-php-pwd.service: "scripts-php-pwd"
            traefik.http.routers.scripts-php-pwd.middlewares: "redirect-to-https@docker"
            traefik.http.routers.scripts-php-pwd-secure.rule: "Host(`${DOMAIN:-scripts-php-pwd.localhost}`)"
            traefik.http.routers.scripts-php-pwd-secure.entrypoints: "https"
            traefik.http.routers.scripts-php-pwd-secure.tls: "true"
            traefik.http.routers.scripts-php-pwd-secure.service: "scripts-php-pwd"
        tty: true

networks:
    shared-network:
        name: ${SHARED_NETWORK_NAME:-shared-network}
        external: true

volumes:
    shared-home:
        name: ${SHARED_HOME_VOLUME:-shared-home}
        external: true
    caddy-data:
        name: scripts-php-pwd-caddy-data
    caddy-config:
        name: scripts-php-pwd-caddy-config
