name: scripts-php-opcache-reset

services:
    php:
        container_name: scripts-php-opcache-reset-php
        build:
            context: .
            dockerfile: ./Dockerfile
            target: app
            network: host
            args:
                TZ: ${TZ:-Europe/Warsaw}
                USER: ${APP_USER:-app}
                GROUP: ${APP_GROUP:-app}
                UID: ${UID:-1000}
                GID: ${GID:-1000}
        restart: unless-stopped
        environment:
            HOME: /home/${APP_USER:-app}
            PHP_IDE_CONFIG: "serverName=scripts-php-opcache-reset.localhost"
        tty: true
        networks:
            shared-network-internal:
            shared-network:
        volumes:
            - caddy-data:/data
            - caddy-config:/config
            - shared-home:/home/${APP_USER:-app}
            - .:/var/www/html
            - ./configs/php.ini:/usr/local/etc/php/php.ini
            - ./configs/Caddyfile:/etc/frankenphp/Caddyfile
        labels:
            traefik.enable: true
            traefik.http.services.scripts-php-opcache-reset.loadbalancer.server.port: 80
            traefik.http.services.scripts-php-opcache-reset-secure.loadbalancer.server.port: 443
            traefik.http.routers.scripts-php-opcache-reset.rule: Host(`${DOMAIN:-scripts-php-opcache-reset.localhost}`)
            traefik.http.routers.scripts-php-opcache-reset.entrypoints: http
            traefik.http.routers.scripts-php-opcache-reset.tls: false
            traefik.http.routers.scripts-php-opcache-reset.service: scripts-php-opcache-reset
            traefik.http.routers.scripts-php-opcache-reset-secure.rule: Host(`${DOMAIN:-scripts-php-opcache-reset.localhost}`)
            traefik.http.routers.scripts-php-opcache-reset-secure.entrypoints: https
            traefik.http.routers.scripts-php-opcache-reset-secure.tls: true
            traefik.http.routers.scripts-php-opcache-reset-secure.service: scripts-php-opcache-reset-secure

networks:
    shared-network-internal:
        name: ${SHARED_NETWORK_NAME:-shared-network-internal}
        external: true
    shared-network:
        name: ${SHARED_NETWORK_NAME:-shared-network}
        external: true

volumes:
    shared-home:
        name: ${SHARED_HOME_VOLUME:-shared-home}
        external: true
    caddy-data:
        name: scripts-php-opcache-reset-caddy-data
    caddy-config:
        name: scripts-php-opcache-reset-caddy-config
