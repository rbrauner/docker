name: percona5

services:
    percona5:
        container_name: percona5
        image: percona/percona-server:5.7
        restart: unless-stopped
        # user: "${UID:-1000}:${GID:-1000}"
        environment:
            TZ: "${TZ:-Europe/Warsaw}"
            BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-7}"
            MYSQL_DATABASE: "${DB_NAME:-default}"
            MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-secret}"
        # ports:
        #     - ${DB_BIND_IP:-127.0.0.1}:${DB_PORT:-3315}:3306
        networks:
            shared-network:
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - shared-home:/home/${APP_USER:-app}
            - percona5-data:/var/lib/mysql
            - percona5-conf:/etc/mysql
            - ../_shared/backup-mysql.sh:/bin/backup.sh:ro
            - ${BACKUP_DIR:-${HOME}/data/backups/docker/percona5}:/backup
        # labels:
        #     ofelia.enabled: "true"
        #     ofelia.job-exec.percona5.command: "/bin/backup.sh"
        #     ofelia.job-exec.percona5.schedule: "${BACKUP_CRON_EXPRESSION:-0 9,15,17,21 * * *}"
        healthcheck:
            test: 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent'
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        tty: true

networks:
    shared-network:
        name: ${SHARED_NETWORK_NAME:-shared-network}
        external: true

volumes:
    shared-home:
        name: ${SHARED_HOME_VOLUME:-shared-home}
        external: true
    percona5-data:
        name: percona5-data
    percona5-conf:
        name: percona5-conf
