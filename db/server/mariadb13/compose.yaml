name: mariadb13

services:
    mariadb13:
        container_name: mariadb13
        image: mariadb:${DB_VERSION:-13}
        restart: unless-stopped
        # user: "${UID:-1000}:${GID:-1000}"
        environment:
            TZ: "${TZ:-Europe/Warsaw}"
            BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-30}"
            MYSQL_DATABASE: "${DB_NAME:-default}"
            MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-secret}"
            MARIADB_AUTO_UPGRADE: "${DB_AUTO_UPGRADE:-1}"
        # ports:
        #     - ${DB_BIND_IP:-127.0.0.1}:${DB_PORT:-3306}:3306
        hostname: "${DOMAIN:-mariadb13.localhost}"
        networks:
            shared-network:
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - shared-home:/home/${APP_USER:-app}
            - mariadb13-data:/var/lib/mysql
            - mariadb13-conf:/etc/mysql
            - ../_shared/backup-mysql.sh:/bin/backup.sh:ro
            - ${BACKUP_DIR:-${HOME}/data/backups/docker/mariadb13}:/backup
        labels:
            # ofelia.enabled: "true"
            # ofelia.job-exec.mariadb13.command: "/bin/backup.sh"
            # ofelia.job-exec.mariadb13.schedule: "${BACKUP_CRON_EXPRESSION:-0 9,15,17,21 * * *}"
            traefik.enable: "true"
            traefik.tcp.services.mariadb13.loadbalancer.server.port: "3306"
            traefik.tcp.routers.mariadb13.rule: "HostSNI(`${DOMAIN:-mariadb13.localhost}`)"
            traefik.tcp.routers.mariadb13.entrypoints: "mysql"
            traefik.tcp.routers.mariadb13.tls: "true"
            traefik.tcp.routers.mariadb13.service: "mariadb13"
        healthcheck:
            test: 'mariadb-admin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent'
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        tty: true

networks:
    shared-network:
        name: ${SHARED_NETWORK_NAME:-shared-network}
        external: true

volumes:
    shared-home:
        name: ${SHARED_HOME_VOLUME:-shared-home}
        external: true
    mariadb13-data:
        name: mariadb13-data
    mariadb13-conf:
        name: mariadb13-conf
