name: redis8

services:
    redis8:
        container_name: redis8
        image: redis:${DB_VERSION:-8-trixie}
        restart: unless-stopped
        command: redis-server --save 60 1 --loglevel warning --requirepass "${DB_PASSWORD:-secret}"
        # user: "${UID:-1000}:${GID:-1000}"
        environment:
            TZ: "${TZ:-Europe/Warsaw}"
        # ports:
        #     - ${DB_BIND_IP:-127.0.0.1}:${DB_PORT:-6379}:6379
        hostname: "${DOMAIN:-redis8.localhost}"
        networks:
            shared-network:
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - shared-home:/home/${APP_USER:-app}
            - redis8-data:/data
        labels:
            traefik.enable: "true"
            traefik.tcp.services.redis8.loadbalancer.server.port: "6379"
            traefik.tcp.routers.redis8.rule: "HostSNI(`${DOMAIN:-redis8.localhost}`)"
            traefik.tcp.routers.redis8.entrypoints: "redis"
            traefik.tcp.routers.redis8.tls: "true"
            traefik.tcp.routers.redis8.service: "redis8"
        healthcheck:
            test: 'redis-cli -a "${DB_PASSWORD:-secret}" --no-auth-warning ping | grep -q PONG'
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        tty: true

networks:
    shared-network:
        name: ${SHARED_NETWORK_NAME:-shared-network}
        external: true

volumes:
    shared-home:
        name: ${SHARED_HOME_VOLUME:-shared-home}
        external: true
    redis8-data:
        name: redis8-data
