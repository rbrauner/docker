name: percona8

services:
    percona8:
        container_name: percona8
        image: percona:${DB_VERSION:-8}
        restart: unless-stopped
        # user: "${UID:-1000}:${GID:-1000}"
        environment:
            TZ: "${TZ:-Europe/Warsaw}"
            BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-30}"
            MYSQL_DATABASE: "${DB_NAME:-default}"
            MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-secret}"
        # ports:
        #     - ${DB_BIND_IP:-127.0.0.1}:${DB_PORT:-3306}:3306
        hostname: "${DOMAIN:-percona8.localhost}"
        networks:
            shared-network:
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - shared-home:/home/${APP_USER:-app}
            - percona8-data:/var/lib/mysql
            - percona8-conf:/etc/mysql
            - ../_shared/backup-mysql.sh:/bin/backup.sh:ro
            - ${BACKUP_DIR:-${HOME}/data/backups/docker/percona8}:/backup
        labels:
            # ofelia.enabled: "true"
            # ofelia.job-exec.percona8.command: "/bin/backup.sh"
            # ofelia.job-exec.percona8.user: "root" # image runs as mysql (uid 1001), which cannot write to /backup
            # ofelia.job-exec.percona8.schedule: "${BACKUP_CRON_EXPRESSION:-0 9,15,17,21 * * *}"
            traefik.enable: "true"
            traefik.tcp.services.percona8.loadbalancer.server.port: "3306"
            traefik.tcp.routers.percona8.rule: "HostSNI(`${DOMAIN:-percona8.localhost}`)"
            traefik.tcp.routers.percona8.entrypoints: "mysql"
            traefik.tcp.routers.percona8.tls: "true"
            traefik.tcp.routers.percona8.service: "percona8"
        healthcheck:
            test: 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent'
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        tty: true

networks:
    shared-network:
        name: ${SHARED_NETWORK_NAME:-shared-network}
        external: true

volumes:
    shared-home:
        name: ${SHARED_HOME_VOLUME:-shared-home}
        external: true
    percona8-data:
        name: percona8-data
    percona8-conf:
        name: percona8-conf
