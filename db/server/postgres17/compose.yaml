name: postgres17

services:
    postgres17:
        container_name: postgres17
        image: postgres:17-trixie
        restart: unless-stopped
        # user: "${UID:-1000}:${GID:-1000}"
        environment:
            TZ: "${TZ:-Europe/Warsaw}"
            BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-7}"
            POSTGRES_USER: "${DB_USER:-root}"
            POSTGRES_PASSWORD: "${DB_PASSWORD:-secret}"
            POSTGRES_DB: "${DB_NAME:-default}"
        # ports:
        #     - ${DB_BIND_IP:-127.0.0.1}:${DB_PORT:-5517}:5432
        networks:
            shared-network:
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - shared-home:/home/${APP_USER:-app}
            - postgres17-data:/var/lib/postgresql/data
            - ../_shared/backup-postgres.sh:/bin/backup.sh:ro
            - ${BACKUP_DIR:-${HOME}/data/backups/docker/postgres17}:/backup
        # labels:
        #     ofelia.enabled: "true"
        #     ofelia.job-exec.postgres17.command: "/bin/backup.sh"
        #     ofelia.job-exec.postgres17.schedule: "${BACKUP_CRON_EXPRESSION:-0 9,15,17,21 * * *}"
        healthcheck:
            test: 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        tty: true

networks:
    shared-network:
        name: ${SHARED_NETWORK_NAME:-shared-network}
        external: true

volumes:
    shared-home:
        name: ${SHARED_HOME_VOLUME:-shared-home}
        external: true
    postgres17-data:
        name: postgres17-data
