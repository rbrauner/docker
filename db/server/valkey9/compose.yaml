name: valkey9

services:
    valkey9:
        container_name: valkey9
        image: valkey/valkey:${DB_VERSION:-9-trixie}
        restart: unless-stopped
        command: valkey-server --save 60 1 --loglevel warning --requirepass "${DB_PASSWORD:-secret}"
        # user: "${UID:-1000}:${GID:-1000}"
        environment:
            TZ: "${TZ:-Europe/Warsaw}"
        # ports:
        #     - ${DB_BIND_IP:-127.0.0.1}:${DB_PORT:-6379}:6379
        hostname: "${DOMAIN:-valkey9.localhost}"
        networks:
            shared-network:
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - shared-home:/home/${APP_USER:-app}
            - valkey9-data:/data
        labels:
            traefik.enable: "true"
            traefik.tcp.services.valkey9.loadbalancer.server.port: "6379"
            traefik.tcp.routers.valkey9.rule: "HostSNI(`${DOMAIN:-valkey9.localhost}`)"
            traefik.tcp.routers.valkey9.entrypoints: "redis"
            traefik.tcp.routers.valkey9.tls: "true"
            traefik.tcp.routers.valkey9.service: "valkey9"
        healthcheck:
            test: 'valkey-cli -a "${DB_PASSWORD:-secret}" --no-auth-warning ping | grep -q PONG'
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        tty: true

networks:
    shared-network:
        name: ${SHARED_NETWORK_NAME:-shared-network}
        external: true

volumes:
    shared-home:
        name: ${SHARED_HOME_VOLUME:-shared-home}
        external: true
    valkey9-data:
        name: valkey9-data
