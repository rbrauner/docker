name: mysql9

services:
    mysql9:
        container_name: mysql9
        image: mysql:${DB_VERSION:-9}
        restart: unless-stopped
        # user: "${UID:-1000}:${GID:-1000}"
        environment:
            TZ: "${TZ:-Europe/Warsaw}"
            BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-30}"
            MYSQL_DATABASE: "${DB_NAME:-default}"
            MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-secret}"
        # ports:
        #     - ${DB_BIND_IP:-127.0.0.1}:${DB_PORT:-3306}:3306
        hostname: "${DOMAIN:-mysql9.localhost}"
        networks:
            shared-network:
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - shared-home:/home/${APP_USER:-app}
            - mysql9-data:/var/lib/mysql
            - mysql9-conf:/etc/mysql
            - ../_shared/backup-mysql.sh:/bin/backup.sh:ro
            - ${BACKUP_DIR:-${HOME}/data/backups/docker/mysql9}:/backup
        labels:
            # ofelia.enabled: "true"
            # ofelia.job-exec.mysql9.command: "/bin/backup.sh"
            # ofelia.job-exec.mysql9.schedule: "${BACKUP_CRON_EXPRESSION:-0 9,15,17,21 * * *}"
            traefik.enable: "true"
            traefik.tcp.services.mysql9.loadbalancer.server.port: "3306"
            traefik.tcp.routers.mysql9.rule: "HostSNI(`${DOMAIN:-mysql9.localhost}`)"
            traefik.tcp.routers.mysql9.entrypoints: "mysql"
            traefik.tcp.routers.mysql9.tls: "true"
            traefik.tcp.routers.mysql9.service: "mysql9"
        healthcheck:
            test: 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent'
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        tty: true

networks:
    shared-network:
        name: ${SHARED_NETWORK_NAME:-shared-network}
        external: true

volumes:
    shared-home:
        name: ${SHARED_HOME_VOLUME:-shared-home}
        external: true
    mysql9-data:
        name: mysql9-data
    mysql9-conf:
        name: mysql9-conf
