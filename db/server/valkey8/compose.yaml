name: valkey8

services:
    valkey8:
        container_name: valkey8
        image: valkey/valkey:8-trixie
        restart: unless-stopped
        command: valkey-server --save 60 1 --loglevel warning --requirepass "${VALKEY_PASSWORD:-secret}"
        # user: "${UID:-1000}:${GID:-1000}"
        environment:
            TZ: "${TZ:-Europe/Warsaw}"
        ports:
            - ${VALKEY_PORT:-6208}:6379
        networks:
            shared-network:
        volumes:
            - shared-home:/home/${APP_USER:-app}
            - valkey8-data:/data
        tty: true

networks:
    shared-network:
        name: ${SHARED_NETWORK_NAME:-shared-network}
        external: true

volumes:
    shared-home:
        name: ${SHARED_HOME_VOLUME:-shared-home}
        external: true
    valkey8-data:
        name: valkey8-data
