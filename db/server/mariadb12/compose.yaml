name: mariadb12

services:
    mariadb12:
        container_name: mariadb12
        image: mariadb:12
        restart: unless-stopped
        # user: "${UID:-1000}:${GID:-1000}"
        environment:
            TZ: "${TZ:-Europe/Warsaw}"
            BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-7}"
            MYSQL_DATABASE: "${DB_NAME:-default}"
            MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-secret}"
        # ports:
        #     - ${DB_BIND_IP:-127.0.0.1}:${DB_PORT:-3312}:3306
        networks:
            shared-network:
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - shared-home:/home/${APP_USER:-app}
            - mariadb12-data:/var/lib/mysql
            - mariadb12-conf:/etc/mysql
            - ../_shared/backup-mysql.sh:/bin/backup.sh:ro
            - ${BACKUP_DIR:-${HOME}/data/backups/docker/mariadb12}:/backup
        # labels:
        #     ofelia.enabled: "true"
        #     ofelia.job-exec.mariadb12.command: "/bin/backup.sh"
        #     ofelia.job-exec.mariadb12.schedule: "${BACKUP_CRON_EXPRESSION:-0 9,15,17,21 * * *}"
        healthcheck:
            test: 'mariadb-admin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent'
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        tty: true

networks:
    shared-network:
        name: ${SHARED_NETWORK_NAME:-shared-network}
        external: true

volumes:
    shared-home:
        name: ${SHARED_HOME_VOLUME:-shared-home}
        external: true
    mariadb12-data:
        name: mariadb12-data
    mariadb12-conf:
        name: mariadb12-conf
