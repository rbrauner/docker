name: pgvector-pg18

services:
    pgvector-pg18:
        container_name: pgvector-pg18
        image: pgvector/pgvector:pg18-trixie
        restart: unless-stopped
        # user: "${UID:-1000}:${GID:-1000}"
        environment:
            TZ: "${TZ:-Europe/Warsaw}"
            POSTGRES_USER: "${DB_USER:-root}"
            POSTGRES_PASSWORD: "${DB_PASSWORD:-secret}"
            POSTGRES_DB: "${DB_NAME:-default}"
        # ports:
        #     - ${DB_BIND_IP:-127.0.0.1}:${DB_PORT:-5418}:5432
        networks:
            shared-network:
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - shared-home:/home/${APP_USER:-app}
            - pgvector-pg18:/var/lib/postgresql/18/docker
            - ./bin/backup.sh:/bin/backup.sh:ro
            - ${BACKUP_DIR:-${HOME}/data/backups/docker/pgvector-pg18}:/backup
        #        labels:
        #             ofelia.enabled: "true"
        #             ofelia.job-exec.pgvector-pg18.command: "/bin/backup.sh"
        #             ofelia.job-exec.pgvector-pg18.schedule: "${BACKUP_CRON_EXPRESSION:-0 9,15,17,21 * * *}"
        tty: true

networks:
    shared-network:
        name: ${SHARED_NETWORK_NAME:-shared-network}
        external: true

volumes:
    shared-home:
        name: ${SHARED_HOME_VOLUME:-shared-home}
        external: true
    pgvector-pg18:
        name: pgvector-pg18
