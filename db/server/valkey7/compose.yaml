name: valkey7

services:
    valkey7:
        container_name: valkey7
        image: valkey/valkey:${DB_VERSION:-7-trixie}
        restart: unless-stopped
        command: valkey-server --save 60 1 --loglevel warning --requirepass "${DB_PASSWORD:-secret}"
        # user: "${UID:-1000}:${GID:-1000}"
        environment:
            TZ: "${TZ:-Europe/Warsaw}"
        # ports:
        #     - ${DB_BIND_IP:-127.0.0.1}:${DB_PORT:-6379}:6379
        hostname: "${DOMAIN:-valkey7.localhost}"
        networks:
            shared-network:
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - shared-home:/home/${APP_USER:-app}
            - valkey7-data:/data
        labels:
            traefik.enable: "true"
            traefik.tcp.services.valkey7.loadbalancer.server.port: "6379"
            traefik.tcp.routers.valkey7.rule: "HostSNI(`${DOMAIN:-valkey7.localhost}`)"
            traefik.tcp.routers.valkey7.entrypoints: "redis"
            traefik.tcp.routers.valkey7.tls: "true"
            traefik.tcp.routers.valkey7.service: "valkey7"
        healthcheck:
            test: 'valkey-cli -a "${DB_PASSWORD:-secret}" --no-auth-warning ping | grep -q PONG'
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        tty: true

networks:
    shared-network:
        name: ${SHARED_NETWORK_NAME:-shared-network}
        external: true

volumes:
    shared-home:
        name: ${SHARED_HOME_VOLUME:-shared-home}
        external: true
    valkey7-data:
        name: valkey7-data
