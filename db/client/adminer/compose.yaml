name: adminer

services:
    adminer:
        container_name: adminer
        image: adminer:${ADMINER_VERSION:-6}
        restart: unless-stopped
        # user: "${UID:-1000}:${GID:-1000}"
        environment:
            TZ: "${TZ:-Europe/Warsaw}"
            ADMINER_PLUGINS: "${ADMINER_PLUGINS:-adminer.js backward-keys before-unload config dark-switcher donation dump-alter dump-bz2 dump-date dump-json dump-xml dump-zip edit-foreign edit-textarea enum-option file-upload foreign-system frames import-csv menu-links select-email select-expression select-foreign select-image slugify sql-log sql-url-length table-indexes-structure table-structure tables-filter timeout}"
        # ports:
        #     - ${ADMINER_BIND_IP:-127.0.0.1}:${ADMINER_PORT:-8080}:8080
        hostname: "${DOMAIN:-adminer.localhost}"
        networks:
            shared-network:
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - shared-home:/home/${APP_USER:-app}
        labels:
            # caddy: "${DOMAIN:-adminer.localhost}"
            # caddy.reverse_proxy: "{{upstreams 8080}}"
            traefik.enable: "true"
            traefik.http.services.adminer.loadbalancer.server.port: "8080"
            traefik.http.routers.adminer.rule: "Host(`${DOMAIN:-adminer.localhost}`)"
            traefik.http.routers.adminer.entrypoints: "http"
            traefik.http.routers.adminer.tls: "false"
            traefik.http.routers.adminer.service: "adminer"
            traefik.http.routers.adminer.middlewares: "redirect-to-https@docker"
            traefik.http.routers.adminer-secure.rule: "Host(`${DOMAIN:-adminer.localhost}`)"
            traefik.http.routers.adminer-secure.entrypoints: "https"
            traefik.http.routers.adminer-secure.tls: "true"
            traefik.http.routers.adminer-secure.service: "adminer"
        healthcheck:
            test: "wget -qO /dev/null http://127.0.0.1:8080/"
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        tty: true

networks:
    shared-network:
        name: ${SHARED_NETWORK_NAME:-shared-network}
        external: true

volumes:
    shared-home:
        name: ${SHARED_HOME_VOLUME:-shared-home}
        external: true
