name: phpmyadmin

services:
    phpmyadmin:
        container_name: phpmyadmin
        image: phpmyadmin:fpm
        restart: unless-stopped
        # user: "${UID:-1000}:${GID:-1000}"
        environment:
            TZ: "${TZ:-Europe/Warsaw}"
            PMA_ARBITRARY: ${PMA_ARBITRARY:-1}
        # ports:
        #     - ${PHPMYADMIN_BIND_IP:-127.0.0.1}:${PHPMYADMIN_PORT:-8080}:80
        hostname: "${DOMAIN:-phpmyadmin.localhost}"
        networks:
            shared-network:
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - shared-home:/home/${APP_USER:-app}
        labels:
            # caddy: "${DOMAIN:-phpmyadmin.localhost}"
            # caddy.reverse_proxy: "{{upstreams http}}"
            traefik.enable: "true"
            traefik.http.services.phpmyadmin.loadbalancer.server.port: "80"
            traefik.http.routers.phpmyadmin.rule: "Host(`${DOMAIN:-phpmyadmin.localhost}`)"
            traefik.http.routers.phpmyadmin.entrypoints: "http"
            traefik.http.routers.phpmyadmin.tls: "false"
            traefik.http.routers.phpmyadmin.service: "phpmyadmin"
            traefik.http.routers.phpmyadmin.middlewares: "redirect-to-https@docker"
            traefik.http.routers.phpmyadmin-secure.rule: "Host(`${DOMAIN:-phpmyadmin.localhost}`)"
            traefik.http.routers.phpmyadmin-secure.entrypoints: "https"
            traefik.http.routers.phpmyadmin-secure.tls: "true"
            traefik.http.routers.phpmyadmin-secure.service: "phpmyadmin"
        tty: true

networks:
    shared-network:
        name: ${SHARED_NETWORK_NAME:-shared-network}
        external: true

volumes:
    shared-home:
        name: ${SHARED_HOME_VOLUME:-shared-home}
        external: true
