global:
    sendAnonymousUsage: false

ping:
    entryPoint: traefik

api:
    dashboard: true
    insecure: true

providers:
    docker:
        endpoint: "unix:///var/run/docker.sock"
        watch: true
        exposedByDefault: false

    file:
        filename: /etc/traefik/dynamic.yaml
        watch: true

entryPoints:
    traefik:
        address: ":8999"
    http:
        address: ":80"
    https:
        address: ":443"
    mysql:
        address: ":3306"
    postgres:
        address: ":5432"
    redis:
        address: ":6379"
    mailserver25:
        address: ":25"
    mailserver465:
        address: ":465"
    mailserver587:
        address: ":587"
    mailserver993:
        address: ":993"
    rabbitmq:
        address: ":5672"
