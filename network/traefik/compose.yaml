name: traefik

services:
    traefik:
        container_name: traefik
        image: traefik:3
        restart: unless-stopped
        # user: "${UID:-1000}:${GID:-1000}"
        user: "root"
        security_opt:
            - label=disable
        environment:
            TZ: "${TZ:-Europe/Warsaw}"
        ports:
            - ${TRAEFIK_PORT_80:-80}:80
            - ${TRAEFIK_PORT_443_TCP:-443}:443/tcp
            - ${TRAEFIK_PORT_443_UDP:-443}:443/udp
            - ${TRAEFIK_PORT_3306:-3306}:3306
            - ${TRAEFIK_PORT_5432:-5432}:5432
            - ${TRAEFIK_PORT_6379:-6379}:6379
            - ${TRAEFIK_PORT_25:-25}:25
            - ${TRAEFIK_PORT_465:-465}:465
            - ${TRAEFIK_PORT_587:-587}:587
            - ${TRAEFIK_PORT_993:-993}:993
            - ${TRAEFIK_PORT_5672:-5672}:5672
        hostname: "${DOMAIN:-traefik.localhost}"
        networks:
            shared-network:
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - shared-home:/home/${APP_USER:-app}
            - ./config/traefik.yaml:/etc/traefik/traefik.yaml:ro
            - ./config/dynamic.yaml:/etc/traefik/dynamic.yaml:ro
            - ./certs:/etc/certs:ro
        labels:
            traefik.enable: "true"
            # Redirect http to https
            traefik.http.middlewares.redirect-to-https.redirectscheme.scheme: "https"
            traefik.http.middlewares.redirect-to-https.redirectscheme.permanent: "true"
            # traefik.localhost
            traefik.http.routers.traefik.rule: "Host(`${DOMAIN:-traefik.localhost}`)"
            traefik.http.routers.traefik.service: "api@internal"
        tty: true

networks:
    shared-network:
        name: ${SHARED_NETWORK_NAME:-shared-network}
        external: true

volumes:
    shared-home:
        name: ${SHARED_HOME_VOLUME:-shared-home}
        external: true
