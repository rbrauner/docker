name: caddy-labels

services:
    caddy-labels:
        container_name: caddy-labels
        # no major tag published - bump manually
        image: lucaslorentz/caddy-docker-proxy:${CADDY_LABELS_VERSION:-2.13-alpine}
        restart: unless-stopped
        # user: "${UID:-1000}:${GID:-1000}"
        user: "root"
        security_opt:
            - label=disable
        environment:
            TZ: "${TZ:-Europe/Warsaw}"
            CADDY_INGRESS_NETWORKS: "${CADDY_INGRESS_NETWORKS:-shared-network}"
        ports:
            - ${CADDY_LABELS_BIND_IP:-127.0.0.1}:${CADDY_LABELS_PORT_2019:-2019}:2020
            - ${CADDY_LABELS_BIND_IP:-127.0.0.1}:${CADDY_LABELS_PORT_80:-80}:80
            - ${CADDY_LABELS_BIND_IP:-127.0.0.1}:${CADDY_LABELS_PORT_443:-443}:443
        networks:
            shared-network:
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - shared-home:/home/${APP_USER:-app}
            - caddy-labels-data:/data
            - caddy-labels-config:/config
        labels:
            caddy_0.servers.trusted_proxies: "static private_ranges"
            caddy_1: ":2020"
            caddy_1.reverse_proxy: "localhost:2019"
        healthcheck:
            test: "wget -qO /dev/null http://127.0.0.1:2019/config/"
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        tty: true

networks:
    shared-network:
        name: ${SHARED_NETWORK_NAME:-shared-network}
        external: true

volumes:
    shared-home:
        name: ${SHARED_HOME_VOLUME:-shared-home}
        external: true
    caddy-labels-data:
        name: caddy-labels-data
    caddy-labels-config:
        name: caddy-labels-config
